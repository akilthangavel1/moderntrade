<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Ticker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Select Ticker</h2>
        <div class="mb-3">
            <label for="tickerSelect" class="form-label">Choose a Ticker:</label>
            <select id="tickerSelect" class="form-select">
                <!-- Tickers will be populated here -->
            </select>
        </div>
        <button class="btn btn-primary" onclick="getTickerData()">Get Ticker Data</button>
        <div id="tickerData" class="mt-4">
            <!-- Ticker data will be displayed here -->
        </div>
    </div>

    <script>
        // JavaScript to populate the ticker dropdown
        async function populateTickerSelect() {
            try {
                const response = await fetch('/api/get_tickers');  // Backend endpoint to fetch tickers
                if (!response.ok) throw new Error("Failed to fetch tickers.");

                const tickers = await response.json();
                const tickerSelect = document.getElementById('tickerSelect');
                
                // Populate the dropdown with ticker options
                tickers.forEach(ticker => {
                    const option = document.createElement('option');
                    option.value = ticker.ticker_symbol;  // Assuming 'ticker_symbol' is the key for ticker symbol
                    option.textContent = ticker.ticker_name;  // Assuming 'ticker_name' is the key for ticker name
                    tickerSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error populating ticker dropdown:", error);
            }
        }

        // Call populate function on page load
        document.addEventListener('DOMContentLoaded', populateTickerSelect);

        // Function to fetch ticker data for the selected ticker symbol
        async function getTickerData() {
            const tickerSymbol = document.getElementById('tickerSelect').value;
            if (!tickerSymbol) {
                alert("Please select a ticker.");
                return;
            }

            try {
                const response = await fetch(`/api/get_ticker_data?ticker_symbol=${tickerSymbol}`);
                if (!response.ok) throw new Error("Failed to fetch ticker data.");

                const data = await response.json();
                const tickerDataDiv = document.getElementById('tickerData');
                tickerDataDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('tickerData').innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
