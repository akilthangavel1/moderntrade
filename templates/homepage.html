{% extends 'base.html' %}
{%  block content %}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #1e1e1e;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background-color: #4c4747;
            color: #ffffff;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
            border-right: 1px solid #444;
        }

        th {
            font-size: .85em;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr {
            border-bottom: 1px solid #444;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        td:last-child {
            border-right: 0;
        }

        tr:nth-child(even) {
            background-color: #2c2c2c;
        }

        tbody tr:hover {
            background-color: #333333;
        }

        @media screen and (max-width: 600px) {
            table {
                border: 0;
            }

            thead {
                border: none;
                clip: rect(0 0 0 0);
                height: 1px;
                margin: -1px;
                overflow: hidden;
                padding: 0;
                position: absolute;
                width: 1px;
            }

            tr {
                border-bottom: 3px solid #444;
                display: block;
                margin-bottom: .625em;
            }

            td {
                border-bottom: 1px solid #444;
                display: block;
                font-size: .8em;
                text-align: right;
            }

            td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                text-transform: uppercase;
            }

            td:last-child {
                border-bottom: 0;
            }
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th scope="col">Ticker Name</th>
                <th scope="col">Sector</th>
                <th scope="col">Sub-Sector</th>
                <th scope="col">Market Cap</th>
                <th scope="col">LTP</th>
                <th scope="col">Daily Change</th>
                <th scope="col">Weekly Change</th>
                <th scope="col">Prev. Day Open</th>
                <th scope="col">Prev. Day High</th>
                <th scope="col">Prev. Day Low</th>
                <th scope="col">Prev. Day Close</th>
                <th scope="col">Latest Open</th>
                <th scope="col">Latest High</th>
                <th scope="col">Latest Low</th>
                <th scope="col">WO</th>
                <th scope="col">WH</th>
                <th scope="col">WL</th>
                <th scope="col">WC</th>
                <th scope="col">WPO</th>
                <th scope="col">WPH</th>
                <th scope="col">WPL</th>
                <th scope="col">WPC</th>
                <th scope="col">WPR</th>
                <th scope="col">WPC</th>
                <th scope="col">WPX</th>
                <th scope="col">WPQ</th>
            </tr>
        </thead>
        <tbody id="ticker-table-body">
            <!-- Dynamic content will be inserted here -->
        </tbody>
    </table>

    <script>
        const eventSource = new EventSource('/event-stream/');

        eventSource.onmessage = function(event) {
            const data = event.data;
            const tickerList = JSON.parse(data);
            const tableBody = document.getElementById('ticker-table-body');

            tableBody.innerHTML = ''; // Clear previous data

            tickerList.forEach(function(ticker) {
                const row = document.createElement('tr');

                const cellTickerName = document.createElement('td');
                cellTickerName.textContent = ticker.name;
                row.appendChild(cellTickerName);

                const cellSector = document.createElement('td');
                cellSector.textContent = ticker.sector;
                row.appendChild(cellSector);

                const cellSubSector = document.createElement('td');
                cellSubSector.textContent = ticker.sub_sector || "N/A";
                row.appendChild(cellSubSector);

                const cellMarketCap = document.createElement('td');
                cellMarketCap.textContent = ticker.market_cap;
                row.appendChild(cellMarketCap);

                const cellLTP = document.createElement('td');
                cellLTP.textContent = ticker.ltp !== null ? ticker.ltp.toFixed(2) : "N/A";
                row.appendChild(cellLTP);

                const cellDailyChange = document.createElement('td');
                cellDailyChange.textContent = ticker.daily_change !== null ? ticker.daily_change.toFixed(2) : "N/A";
                row.appendChild(cellDailyChange);

                const cellWeeklyChange = document.createElement('td');
                cellWeeklyChange.textContent = ticker.weekly_change !== null ? ticker.weekly_change.toFixed(2) : "N/A";
                row.appendChild(cellWeeklyChange);

                const cellPreviousDayOpen = document.createElement('td');
                cellPreviousDayOpen.textContent = ticker.previous_day_open !== null ? ticker.previous_day_open.toFixed(2) : "N/A";
                row.appendChild(cellPreviousDayOpen);

                const cellPreviousDayHigh = document.createElement('td');
                cellPreviousDayHigh.textContent = ticker.previous_day_high !== null ? ticker.previous_day_high.toFixed(2) : "N/A";
                row.appendChild(cellPreviousDayHigh);

                const cellPreviousDayLow = document.createElement('td');
                cellPreviousDayLow.textContent = ticker.previous_day_low !== null ? ticker.previous_day_low.toFixed(2) : "N/A";
                row.appendChild(cellPreviousDayLow);

                const cellPreviousDayClose = document.createElement('td');
                cellPreviousDayClose.textContent = ticker.previous_day_close !== null ? ticker.previous_day_close.toFixed(2) : "N/A";
                row.appendChild(cellPreviousDayClose);

                const cellLatestOpen = document.createElement('td');
                cellLatestOpen.textContent = ticker.latest_open !== null ? ticker.latest_open.toFixed(2) : "N/A";
                row.appendChild(cellLatestOpen);

                const cellLatestHigh = document.createElement('td');
                cellLatestHigh.textContent = ticker.latest_high !== null ? ticker.latest_high.toFixed(2) : "N/A";
                row.appendChild(cellLatestHigh);

                const cellLatestLow = document.createElement('td');
                cellLatestLow.textContent = ticker.latest_low !== null ? ticker.latest_low.toFixed(2) : "N/A";
                row.appendChild(cellLatestLow);

                tableBody.appendChild(row);
            });
        };

        eventSource.onerror = function() {
            console.error("EventSource failed.");
        };
    </script>
{% endblock %}
